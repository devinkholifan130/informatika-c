<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penanggung Jawab - INF C</title>
    <link rel="icon" href="INFOR C.png">
    <link rel="stylesheet" href="style2.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .page-header { text-align: center; margin-bottom: 40px; padding-top: 40px; }
        .page-header h1 { font-size: 32px; color: #1a1a2e; margin-bottom: 10px; }
        .btn-back { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 20px; color: #0047AB; text-decoration: none; font-weight: 600; }
        .btn-back:hover { text-decoration: underline; }
        .ph-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .ph-card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; border-top: 4px solid #0047AB; transition: transform 0.3s; }
        .ph-card:hover { transform: translateY(-5px); }
        .ph-avatar { width: 60px; height: 60px; background: #f0f0f0; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px; font-size: 24px; color: #0047AB; }
        .ph-name { font-size: 18px; font-weight: 700; color: #1a1a2e; margin-bottom: 5px; }
        .ph-nim { font-size: 14px; color: #666; margin-bottom: 15px; }
        .ph-mk { font-size: 13px; color: #0047AB; background: rgba(0,71,171,0.1); padding: 5px 10px; border-radius: 20px; display: inline-block; margin-bottom: 15px; }
        .ph-wa { display: inline-flex; align-items: center; gap: 8px; background: #28a745; color: white; padding: 10px 20px; border-radius: 25px; text-decoration: none; font-weight: 600; transition: all 0.3s; }
        .ph-wa:hover { background: #218838; transform: scale(1.05); }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <img src="INFOR C.png" alt="INF C Logo" class="nav-logo-img">
                <span>INF C</span>
            </a>
        </div>
    </nav>

    <div class="section-container" style="max-width: 1200px; margin: 0 auto; padding: 20px;">
        <a href="index.html#schedule" class="btn-back"><i class="fas fa-arrow-left"></i> Kembali ke Beranda</a>
        <div class="page-header">
            <h1><i class="fas fa-user-tie"></i> Daftar Penanggung Jawab (PJ)</h1>
            <p>Hubungi penanggung jawab mata kuliah untuk pertanyaan atau koordinasi.</p>
        </div>

        <div class="ph-grid" id="ph-grid"></div>
        <div id="empty-state-ph" class="empty-state" style="display: none; padding: 40px;">
            <i class="fas fa-users-slash"></i>
            <p>Belum ada data penanggung jawab.</p>
        </div>
    </div>

    <footer class="footer" style="margin-top: 60px;">
        <div class="footer-bottom">
            <p>&copy; 2026 <span class="highlight">INF C</span>. All rights reserved.</p>
        </div>
    </footer>

    <script>
        const DB_NAME = 'INF_C_Database';
        const DB_VERSION = 2;

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function getAllJadwalFromIndexedDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onsuccess = (event) => {
                    const db = event.target.result;
                    const transaction = db.transaction(['jadwal'], 'readonly');
                    const store = transaction.objectStore('jadwal');
                    const req = store.getAll();
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => reject(req.error);
                };
                request.onerror = () => reject(request.error);
            });
        }

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const jadwalData = await getAllJadwalFromIndexedDB();
                const grid = document.getElementById('ph-grid');
                const emptyState = document.getElementById('empty-state-ph');

                if (jadwalData.length === 0) {
                    emptyState.style.display = 'block';
                } else {
                    const pjMap = new Map();
                    jadwalData.forEach(item => {
                        if (!pjMap.has(item.pjNim)) {
                            pjMap.set(item.pjNim, {
                                nama: item.pjNama,
                                nim: item.pjNim,
                                wa: item.pjWa,
                                mks: []
                            });
                        }
                        pjMap.get(item.pjNim).mks.push(item.mk);
                    });

                    grid.innerHTML = Array.from(pjMap.values()).map(pj => `
                        <div class="ph-card">
                            <div class="ph-avatar"><i class="fas fa-user"></i></div>
                            <div class="ph-name">${escapeHtml(pj.nama)}</div>
                            <div class="ph-nim">NIM: ${escapeHtml(pj.nim)}</div>
                            <div class="ph-mk">${pj.mks.length} Mata Kuliah</div>
                            <div style="font-size: 12px; color: #666; margin-bottom: 15px; text-align: left; padding: 0 10px;">
                                ${pj.mks.map(mk => `• ${escapeHtml(mk)}`).join('<br>')}
                            </div>
                            <a href="https://wa.me/${pj.wa.replace(/\D/g, '')}" target="_blank" class="ph-wa">
                                <i class="fab fa-whatsapp"></i> Hubungi via WhatsApp
                            </a>
                        </div>
                    `).join('');
                }
            } catch (error) {
                console.error('Error loading PJ:', error);
            }
        });
    </script>
</body>
</html>
